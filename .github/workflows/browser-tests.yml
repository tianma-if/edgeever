name: Browser tests

on:
  pull_request:
    paths: &browser_paths
      - "apps/web/**"
      - "apps/api/**"
      - "apps/desktop/package.json"
      - "packages/**"
      # The import pipeline has its own real-API regression tests.
      - "!apps/web/src/lib/note-import/**"
      - "!packages/shared/src/note-import/**"
      - "migrations/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "tsconfig.json"
      - "tailwind.config.ts"
      - "wrangler.toml"
      - "release-summary.json"
      - "playwright.config.ts"
      - "scripts/local-dev.mjs"
      - "scripts/prepare-poster-thumbnails.*"
      - "scripts/run-wrangler.mjs"
      - "tests/browser/**"
      - "tests/e2e/**"
      - "tests/note-print.integration.mjs"
      - ".github/workflows/browser-tests.yml"
  push:
    branches:
      - main
    paths: *browser_paths
  workflow_dispatch:
    inputs:
      notebook_validation_rounds:
        description: "Run the selected browser tests once or repeat the notebook appearance scenarios"
        type: choice
        options: ["1", "3"]
        default: "1"

permissions:
  contents: read

concurrency:
  group: edgeever-browser-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  notebook-appearance:
    if: github.repository == 'tianma-if/edgeever'
    name: Notebook appearance (Chromium and WebKit)
    # Safari's mouse-focus behavior differs from Chromium and from Linux WebKit.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [[ "$attempt" = "3" ]]; then
              exit 1
            fi
            sleep "$((15 * attempt))"
          done

      - name: Install Chromium and WebKit
        run: bun run test:e2e:install

      - name: Build the Web bundle for notebook appearance
        run: bun run build:web

      - name: Verify note print pagination and PDF content
        run: bun run verify:note-print

      - name: Test notebook appearance, memo sort persistence and note focus shortcuts
        if: inputs.notebook_validation_rounds != '3'
        env:
          EDGE_EVER_E2E_BUILT_WEB: "1"
        run: bun run test:e2e --retries=0 tests/e2e/notebook-appearance.spec.ts tests/e2e/memo-sort-preference.spec.ts tests/e2e/note-focus-shortcuts.spec.ts tests/e2e/ai-model-output-budgets.spec.ts tests/e2e/memo-list-density.spec.ts tests/e2e/memo-startup-selection.spec.ts

      - name: Test editor sync races
        if: inputs.notebook_validation_rounds != '3'
        env:
          EDGE_EVER_E2E_BUILT_WEB: "1"
        run: bun run test:e2e --project=chromium --retries=0 tests/e2e/memo-sync-race.spec.ts tests/e2e/infographic-sync-race.spec.ts

      - name: Repeat notebook appearance tests without retries
        if: inputs.notebook_validation_rounds == '3'
        env:
          EDGE_EVER_E2E_BUILT_WEB: "1"
        run: bun run test:e2e --retries=0 --repeat-each=3 tests/e2e/notebook-appearance.spec.ts

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: |
            test-results/**/trace.zip
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
