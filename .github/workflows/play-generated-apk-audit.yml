name: Audit Play Generated APKs

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Google Play Android versionCode"
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'tianma-if/edgeever'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Inspect generated APK types
        env:
          ANDROID_PLAY_APP_SIGNER_SHA256: ${{ secrets.ANDROID_PLAY_APP_SIGNER_SHA256 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: node scripts/download-play-universal-apk.mjs "${{ inputs.version_code }}" --inspect
