name: Test

# Runs regression tests, focused browser tests, lint, type checks and the web build for every
# pull request and every push to main, so failures surface before a release
# instead of in the release workflow.
on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "marketing/video/**"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "marketing/video/**"
  workflow_dispatch:
    inputs:
      notebook_validation_rounds:
        description: "Run the full browser suite once or repeat the notebook appearance scenarios"
        type: choice
        options: ["1", "3"]
        default: "1"

permissions:
  contents: read

concurrency:
  group: edgeever-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Forks that deploy their own copy do not spend runners on this; pull
    # requests opened against this repository still run here.
    if: github.repository == 'tianma-if/edgeever'
    name: Type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [[ "$attempt" = "3" ]]; then
              exit 1
            fi
            sleep "$((15 * attempt))"
          done

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Type check mobile
        run: bun run typecheck:mobile

      - name: Build web
        run: bun run build:web

  tests:
    if: github.repository == 'tianma-if/edgeever'
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [[ "$attempt" = "3" ]]; then
              exit 1
            fi
            sleep "$((15 * attempt))"
          done

      - name: Run regression tests
        run: bun run test

  notebook-appearance:
    if: github.repository == 'tianma-if/edgeever'
    name: Notebook appearance (Chromium and WebKit)
    # Safari's mouse-focus behavior differs from Chromium and from Linux WebKit.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [[ "$attempt" = "3" ]]; then
              exit 1
            fi
            sleep "$((15 * attempt))"
          done

      - name: Install Chromium and WebKit
        run: bun run test:e2e:install

      - name: Build the Web bundle for notebook appearance
        run: bun run build:web

      - name: Test notebook appearance, memo sort persistence and note focus shortcuts
        if: inputs.notebook_validation_rounds != '3'
        env:
          EDGE_EVER_E2E_BUILT_WEB: "1"
        run: bun run test:e2e --retries=0 tests/e2e/notebook-appearance.spec.ts tests/e2e/memo-sort-preference.spec.ts tests/e2e/note-focus-shortcuts.spec.ts tests/e2e/ai-model-output-budgets.spec.ts tests/e2e/memo-list-density.spec.ts tests/e2e/memo-startup-selection.spec.ts

      - name: Repeat notebook appearance tests without retries
        if: inputs.notebook_validation_rounds == '3'
        env:
          EDGE_EVER_E2E_BUILT_WEB: "1"
        run: bun run test:e2e --retries=0 --repeat-each=3 tests/e2e/notebook-appearance.spec.ts

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: |
            test-results/**/trace.zip
            test-results/**/test-failed-*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
