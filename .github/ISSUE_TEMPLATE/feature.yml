name: Feature request
description: Suggest a new capability or a change to an existing one.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you cannot do today and how you want it to work. GitHub Issues are public. Do not include passwords, tokens, instance URLs, or note contents.

        System information helps us check whether your version already supports the feature.
  - type: dropdown
    id: client
    attributes:
      label: Target area
      description: Select the clients that should support this feature. Choose Server for backend, API, or self-hosting features.
      multiple: true
      options:
        - Web
        - macOS
        - Windows
        - Linux
        - Android
        - iOS
        - Browser extension
        - Server
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Requested capability
      description: What should become possible?
      placeholder: "For example: On mobile, switch a note from Markdown back to rich text and keep editing."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How you handle this today
      description: How do you handle this today, and where does it break down?
    validations:
      required: true
  - type: textarea
    id: system-info
    attributes:
      label: System information
      description: Paste the text copied from Settings → System information. In-app feedback fills this in automatically. For server-only requests, enter the instance version and deployment platform, or write "Unknown".
      placeholder: |
        - Client version: v1.93.0
        - System: Android
    validations:
      required: true
