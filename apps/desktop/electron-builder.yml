appId: org.edgeever.desktop
productName: EdgeEver
executableName: EdgeEver
publish:
  provider: github
  owner: tianma-if
  repo: edgeever
  releaseType: release
protocols:
  - name: EdgeEver Deep Link
    schemes:
      - edgeever
fileAssociations:
  - ext:
      - md
      - markdown
    name: Markdown document
    description: Open a Markdown document in EdgeEver
    role: Editor
asar: true
# Cross-platform master (1024). macOS uses the prebuilt full ICNS below so Dock
# always receives ic10/ic14 instead of electron-builder's thin 512-only pack.
icon: assets/icon.png
directories:
  output: ../../release/desktop
files:
  - src/**
  - package.json
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"
  - from: assets
    to: tray
    filter:
      - "trayTemplate.png"
      - "trayTemplate@2x.png"
  - from: assets
    to: .
    filter:
      - "icon.icns"
      - "icon.png"
  - from: ../../migrations
    to: migrations
    filter:
      - "**/*.sql"
  - from: ../../crates/desktop-sidecar/target/release
    to: sidecar
    filter:
      - edgeever-sidecar
      - edgeever-sidecar.exe
mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  minimumSystemVersion: "13.0"
  target:
    - target: dmg
    - target: zip
  artifactName: EdgeEver-${version}-mac-${arch}.${ext}
dmg:
  title: "EdgeEver: double-click to install"
  backgroundColor: '#f5f7f6'
  iconSize: 112
  window:
    width: 720
    height: 480
win:
  target:
    - nsis
  artifactName: EdgeEver-${version}-windows-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
linux:
  category: Utility
  syncDesktopName: true
  target:
    - AppImage
  artifactName: EdgeEver-${version}-linux-${arch}.${ext}
