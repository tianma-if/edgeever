<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="zhihuSaveWindowTitle">Save Zhihu content to EdgeEver</title>
  </head>
  <body>
    <main class="image-save-shell">
      <h1 data-i18n="zhihuSaveWindowTitle">Save Zhihu content to EdgeEver</h1>
      <p class="hint" data-i18n="zhihuPermissionIntro">A feed lists many answers and articles. Allow access to Zhihu so the clipper can remember the one under the pointer. After that, right-click the same text once more. Only the answer or article you choose is saved to the clipper's default notebook.</p>
      <div class="image-save-actions">
        <button id="allow" type="button" data-i18n="allowZhihuAccess">Allow access to Zhihu</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="/src/zhihu-save.ts"></script>
  </body>
</html>
