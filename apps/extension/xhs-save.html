<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="xhsSaveWindowTitle">Save Xiaohongshu note to EdgeEver</title>
  </head>
  <body>
    <main class="image-save-shell">
      <h1 data-i18n="xhsSaveWindowTitle">Save Xiaohongshu note to EdgeEver</h1>
      <p class="hint" data-i18n="xhsPermissionIntro">The feed has many notes. Allow access to Xiaohongshu so the clipper can remember the note under the pointer. After that, right-click the same note once more. Only the note you choose is saved to the clipper's default notebook.</p>
      <div class="image-save-actions">
        <button id="allow" type="button" data-i18n="allowXhsAccess">Allow access to Xiaohongshu</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="/src/xhs-save.ts"></script>
  </body>
</html>
