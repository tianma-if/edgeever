<!doctype html><html><head><meta charset="utf-8"><title>EdgeEver Hero — clean Demo screenshots</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;font-family:Arial,Helvetica,sans-serif}main{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;background:transparent}.desktop{position:absolute;left:1.8%;top:5.2%;width:89.5%;border:1px solid #a4a8a5;border-radius:14px;overflow:hidden;background:#f6f7f8;box-shadow:0 18px 32px #18221b14,0 4px 10px #18221b0a}.bar{height:36px;background:linear-gradient(#f9fafb,#e8e9ec);display:flex;align-items:center;gap:8px;padding:0 15px;border-bottom:1px solid #d3d7d9}.bar i{height:12px;width:12px;border-radius:50%;background:#ff6059}.bar i:nth-child(2){background:#ffbd2e}.bar i:nth-child(3){background:#28c840}.desktop img{width:100%;display:block}.phone img{display:block;width:100%;height:auto}
.phone{
  position:absolute;right:1.2%;top:25%;width:18%;
  padding:4px;
  border:1px solid #424a52;
  border-radius:36px;
  background:linear-gradient(112deg,#c2c8ce 0%,#727b85 7%,#343c44 23%,#89929c 46%,#30373f 69%,#9ba4ae 88%,#515b65 100%);
  box-shadow:inset 0 1px 1px #ffffffb3,inset 0 -1px 1px #060a10b3,0 20px 28px #10182024,0 6px 10px #10182030,0 1px 2px #070b1040;
}
.phone::before{content:"";position:absolute;inset:1px;z-index:3;border:1px solid #ffffff40;border-radius:34px;box-shadow:inset 1px 0 1px #ffffff26,inset -1px 0 1px #02060b66;pointer-events:none}
.phone-screen{position:relative;padding:3px;border-radius:31px;background:#080b10;box-shadow:0 0 0 1px #111820,inset 0 0 0 1px #ffffff1f}
.phone-screen img{border-radius:28px}
.phone-screen::before{content:"";position:absolute;top:10px;left:50%;z-index:2;width:76px;height:20px;transform:translateX(-50%);border:1px solid #050606;border-radius:999px;background:radial-gradient(circle at calc(100% - 13px) calc(50% - 1px),#8190ba88 0 .7px,transparent 1.2px),radial-gradient(circle at calc(100% - 12px) 50%,#405078 0 1.5px,#24314d 2.3px,#10151d 3.1px,#363b49 3.7px,#0b0e13 4.3px,#050606 4.7px);box-shadow:inset 0 0 0 1px #ffffff08,0 1px 2px #00000020;pointer-events:none}
.phone-screen::after{content:"";position:absolute;inset:2px;z-index:3;border:1px solid #ffffff24;border-radius:29px;pointer-events:none}
.phone-key{position:absolute;right:-3px;width:3px;border:1px solid #424b55;border-radius:0 2px 2px 0;background:linear-gradient(90deg,#303842,#a9b2bc 55%,#5a6571);box-shadow:1px 0 2px #090f1826}
.phone-key-volume{top:16%;height:42px}
.phone-key-power{top:26%;height:28px}
</style></head><body><main><div class="desktop"><div class="bar"><i></i><i></i><i></i></div><img src="desktop-source.png" alt="Clean local Demo in EdgeEver Web"></div><div class="phone"><span class="phone-key phone-key-volume" aria-hidden="true"></span><span class="phone-key phone-key-power" aria-hidden="true"></span><div class="phone-screen"><img src="phone-source.png" alt="Actual Android native screenshot of the same overview note"></div></div></main><script>
if (new URLSearchParams(location.search).get("lang") === "en") {
  document.documentElement.lang = "en";
  document.querySelector(".desktop img").src = "desktop-source-en.png";
  document.querySelector(".phone img").src = "phone-source-en.png";
}
</script></body></html>
